name: 4010-DeepLearning
channels:
  - conda-forge
dependencies:
  - pandas
  - python=3.13
  - numpy
  - ipykernel
  - matplotlib
  - scikit-learn
  - statsmodels
  - optuna
  - pytorch
variables:
  # conda-forge's llvm-openmp ships libomp.dll and libiomp5md.dll as the same runtime; torch and MKL each load one, which aborts with OMP Error #15
  KMP_DUPLICATE_LIB_OK: "TRUE"
